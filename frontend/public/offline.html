<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563EB" />
    <title>Biz-transPay — Hors connexion</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f8fafc;
        color: #0f172a;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        background: white;
        box-shadow: 0 12px 40px rgb(15 23 42 / 8%);
      }
      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { margin: 0 0 24px; color: #475569; }
      a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 999px;
        background: #2563eb;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connexion indisponible</h1>
      <p>Vérifiez votre connexion Internet, puis réessayez d’ouvrir Biz-transPay.</p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
